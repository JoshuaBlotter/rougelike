          const v = sf[idx(nx, ny)];
          if (v !== UNREACHABLE && v < bestV) { bestV = v; step = { dx, dy }; }
        }
        if (step) { if (!playerMove(g, step.dx, step.dy)) playerMove(g, 0, 0); }
        else playerMove(g, 0, 0); // no progress available: wait (enemies come to us)
      }
      finalDepth = g.depth; died = g.gameOver;
    } catch (e) { threw = e; }
    check("7. headless 10-floor playthrough completes without throwing",
          threw === null, threw ? String(threw && threw.stack || threw) : "");
    results.push(`         (reached depth ${finalDepth}${died ? ", died" : ", survived"})`);
  }

  // Balance regression guard (not a spec gate): the difficulty curve should keep
  // the early floors survivable. If a change makes the competent bot die before
  // depth 5 on most seeds, something is badly off. Lenient by design.
  {
    let reached5 = 0; const N = 30;
    for (let s = 0; s < N; s++) if (competentBot("guard-" + s).reached >= 5) reached5++;
    check("balance: competent bot reaches depth 5 on >=75% of seeds", reached5 >= N * 0.75, reached5 + "/" + N);
  }

  // Tests 3 & 4: 1000 floors across 1000 seeds, depths 1-10.
  const rep = generateReport(1000, 10);
  check("3. 1000 floors: connected, no wall entity, stairs reachable, no softlock",
        rep.failures.length === 0, rep.failures.length + " failures; first: " +
        (rep.failures[0] ? JSON.stringify(rep.failures[0]) : "none"));
  check("4. generation under 50ms at p95", rep.p95 < 50, "p95=" + rep.p95.toFixed(2) + "ms max=" + rep.max.toFixed(2));

  const summary = `TESTS: ${pass} passed, ${fail} failed`;
  const report = summary + "\n" + results.join("\n");
  if (typeof console !== "undefined") console.log(report);
  return { pass, fail, report };
}

// Pinned expected hash for the "across reload" guarantee: a hardcoded literal,
// NOT recomputed at boot. Any code change that alters generation flips the live
// hash away from this frozen value and test 1b catches it. Re-pin deliberately
// (run ?test=1, read the reported value) when a generation change is intended.
const EXPECTED_HELLO_D1 = 0x4B87EE43 >>> 0; // seed "hello-world", depth 1 (terrain + enemies + items)

// SOURCE_TEXT is filled in by the environment: the browser reads its own
// <script>, Node passes the file text in. Test 5 greps it.
let SOURCE_TEXT = "";

/* =========================================================================
 * PUBLIC API  —  what render + tests reach for
 * =======================================================================*/
const API = {
  fnv1a, mulberry32, makeStream, makeStreams, mixSeed, STREAM_SALTS,
  generateFloor, createGame, descend, tryMovePlayer, isWalkable, tileAt, inBounds,
  bfsDistance, computeFOV, updateFOV, FOV_RADIUS,
  distField8, updateFlow, enemyPhase, enemyAct, enemyThink, huntStep, hasLOS, enemySees, makeEnemy,
  playerMove, playerPickup, usePlayerItem, itemAt, advanceGame, nextReady, simulateEnergy, attack,
  hashRun, generateReport, balanceReport, competentBot, runTests,
  TILE, DIRS8, DIRS4, MAP_W, MAP_H, idx, requiredStairDist, ENEMY_TYPES, ITEM_DEFS, UNREACHABLE, INV_CAP,
  setSource(t) { SOURCE_TEXT = t; },
};

if (typeof module !== "undefined" && module.exports) module.exports = API;
if (typeof window !== "undefined") window.RL = API;
if (typeof globalThis !== "undefined") globalThis.RL = API;

/* =========================================================================
 * RENDER + INPUT  —  browser only; never touched by the simulation
 * =======================================================================*/
if (typeof document !== "undefined") {
  API.setSource(document.currentScript ? document.currentScript.textContent : "");

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const CELL = Math.floor(canvas.width / MAP_W); // 16px cells

  const params = new URLSearchParams(location.search);
  const DEBUG = params.get("debug") === "1";

  let game;
  const debugState = { revealAll: false, flow: false };

  const now = () => (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();

  /* --- Cosmetic effects layer (Milestone 7 juice) ------------------------
   * Movement interpolation, screen shake, hit flashes, damage vignette. ALL
   * of it is render-only: it reads the resolved sim state and NEVER writes to
   * it, so animation can never feed back into game logic. Effects are derived
   * from a before/after diff taken in act(); no new state lives on the sim. */
  const ANIM_MS = 95, SHAKE_MS = 260, HURT_MS = 320, FLASH_MS = 200;
  const fx = { from: null, animAt: 0, snap: true, shakeMag: 0, shakeAt: -1e9, hurtAt: -1e9, flashes: [], raf: 0 };
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const ease = (f) => (f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2); // easeInOutQuad
  const frac = () => clamp01((now() - fx.animAt) / ANIM_MS);
  const shakeNow = () => { const k = 1 - (now() - fx.shakeAt) / SHAKE_MS; return k > 0 ? fx.shakeMag * k : 0; };
  function addFlash(x, y, color) { fx.flashes.push({ x, y, color, at: now() }); }
  function resetFx() { fx.from = null; fx.snap = true; fx.flashes.length = 0; fx.hurtAt = -1e9; fx.shakeAt = -1e9; }
  function startLoop() { if (!fx.raf) fx.raf = requestAnimationFrame(loop); }
  function effectsActive() {
    return (fx.from && !fx.snap && (now() - fx.animAt) < ANIM_MS) ||
           shakeNow() > 0.15 || (now() - fx.hurtAt) < HURT_MS || fx.flashes.length > 0;
  }
  function loop() { fx.raf = 0; draw(); if (effectsActive()) startLoop(); }
  // Interpolated pixel position of an actor between its pre-action cell and its
  // resolved cell. Large jumps (blink, descend, teleport) snap instead of sliding.
  function actorPix(id, gx, gy) {
    const f = fx.from && !fx.snap ? fx.from.get(id) : null;
    if (f && Math.max(Math.abs(gx - f.x), Math.abs(gy - f.y)) <= 1.5) {
      const t = ease(frac());
      return [(f.x + (gx - f.x) * t) * CELL, (f.y + (gy - f.y) * t) * CELL];
    }
    return [gx * CELL, gy * CELL];
  }

  /* --- Web Audio blips (synthesised; no assets) --------------------------- */
  let audioOn = true, audioCtx = null;
  const SOUNDS = {
    hit:     { wave: "square",   f0: 520, f1: 180, dur: 0.09, vol: 0.10 },
    hurt:    { wave: "sawtooth", f0: 200, f1: 70,  dur: 0.16, vol: 0.15 },
    kill:    { wave: "triangle", f0: 320, f1: 60,  dur: 0.18, vol: 0.13 },
    pickup:  { wave: "square",   f0: 620, f1: 1040,dur: 0.10, vol: 0.09 },
    use:     { wave: "triangle", f0: 440, f1: 880, dur: 0.10, vol: 0.09 },
    descend: { wave: "sine",     f0: 150, f1: 330, dur: 0.24, vol: 0.13 },
    death:   { wave: "sawtooth", f0: 220, f1: 40,  dur: 0.70, vol: 0.17 },
  };
  function blip(type) {
    if (!audioOn) return;
    const s = SOUNDS[type]; if (!s) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume(); // unlock on the gesture that drove this action
      const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = s.wave; o.frequency.setValueAtTime(s.f0, t);
      if (s.f1) o.frequency.exponentialRampToValueAtTime(s.f1, t + s.dur);
      g.gain.setValueAtTime(s.vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + s.dur);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + s.dur);
    } catch (_) { /* audio unavailable: stay silent, never break the game */ }
  }

  function pickSeed() {
    return params.get("seed") || Math.floor(API.mulberry32(fnv1a(String(Date.now())))() * 1e9).toString(36);
    // ^ cosmetic-only: choosing a *new* random seed string is outside the sim.
    //   Once chosen, the run is fully deterministic from that string.
  }

  // A UI-only notice (e.g. "Blocked."), kept on the same message log the sim uses.
  function note(msg) { game.messages.push(msg); if (game.messages.length > 6) game.messages.shift(); }

  function newRun(seed, depth = 1) {
    game = createGame(seed, depth);
    document.getElementById("seedInput").value = game.seed;
    document.getElementById("seedShow").textContent = game.seed;
    document.getElementById("depthShow").textContent = game.depth;
    game.messages = ["Welcome. Seed: " + game.seed];
    RL.advanceGame(game); // fast-forward to the player's first turn
    if (DEBUG) RL.updateFlow(game); // populate the flow cache so the overlay shows pre-move
    resetFx();
    hideDeath();
    if (game.gameOver) showDeath();
    render();
  }

  // Run one player action, then derive cosmetic effects from a before/after
  // diff. The sim is fully resolved inside run(); everything after only reads it.
  function act(run) {
    if (!game || game.gameOver) return;
    const wasOver = game.gameOver, prevHp = game.player.hp, prevItems = game.itemsFound;
    const from = new Map();
    from.set("p", { x: game.player.x, y: game.player.y });
    for (const e of game.enemies) if (e.alive) from.set(e.id, { x: e.x, y: e.y, hp: e.hp });

    run();

    fx.snap = false; fx.from = from; fx.animAt = now();
    for (const e of game.enemies) {
      const f = from.get(e.id); if (!f) continue;
      if (!e.alive) { addFlash(e.x, e.y, "255,150,60"); blip("kill"); }        // died where it stood
      else if (e.hp < f.hp) { addFlash(e.x, e.y, "255,255,255"); blip("hit"); } // took a hit
    }
    if (game.player.hp < prevHp) {
      addFlash(game.player.x, game.player.y, "255,60,60");
      fx.hurtAt = now(); fx.shakeMag = Math.min(9, 3 + (prevHp - game.player.hp)); fx.shakeAt = now();
      blip("hurt");
    }
    if (game.itemsFound > prevItems) blip("pickup");
    if (game.gameOver && !wasOver) { blip("death"); fx.shakeMag = 10; fx.shakeAt = now(); showDeath(); }
    render();
    startLoop();
  }

  function renderHud() {
    const p = game.player;
    const pct = Math.max(0, Math.round((p.hp / p.maxHp) * 100));
    document.getElementById("hud").innerHTML =
      `<div class="hpbar"><div class="hpfill" style="width:${pct}%"></div>` +
      `<div class="hptext">${Math.max(0, p.hp)} / ${p.maxHp} HP</div></div>` +
      `<div class="muted">atk ${4 + p.weaponBonus + p.attackBonus} · ${escapeHtml(p.weaponName)}` +
      (p.regen > 0 ? ` · regen ${p.regen}` : "") + `</div>` +
      `<div class="muted">depth ${game.depth} · turn ${game.turn} · kills ${game.kills}</div>` +
      (game.gameOver ? `<div class="dead">YOU DIED — press New run</div>` : "");

    const inv = document.getElementById("inv");
    if (!game.inventory.length) { inv.innerHTML = `<div class="muted">inventory empty · walk over items, press g</div>`; return; }
    inv.innerHTML = `<div class="muted" style="margin-bottom:4px">inventory (${game.inventory.length}/${RL.INV_CAP}) — press number or tap to use</div>` +
      game.inventory.map((s, i) => {
        const d = RL.ITEM_DEFS[s.defId];
        return `<div class="slot" data-slot="${i}" style="cursor:pointer"><span><span class="n">${i + 1}</span> <span style="color:${d.color}">${d.glyph}</span> ${escapeHtml(d.name)}</span>` +
               `<span class="muted">${s.count > 1 ? "x" + s.count : ""}</span></div>`;
      }).join("");
  }

  function renderSide() {
    renderHud();
    const el = document.getElementById("msglog");
    el.innerHTML = game.messages.map((m) => "<div>" + escapeHtml(m) + "</div>").join("");
    if (DEBUG) {
      const enemyStates = game.enemies.filter((e) => e.alive).map((e) => e.state);
      document.getElementById("debugPanel").innerHTML =
        `turn ${game.turn} · player ${game.player.x},${game.player.y} · depth ${game.depth}<br>` +
        `rooms ${game.floor.rooms.length} · enemies ${enemyStates.length} [${enemyStates.join(",")}]` +
        (game.floor.regens ? ` · regens ${game.floor.regens}` : "") + `<br>` +
        `<label><input type="checkbox" id="dbgReveal" ${debugState.revealAll ? "checked" : ""}> reveal all</label>` +
        `<label><input type="checkbox" id="dbgFlow" ${debugState.flow ? "checked" : ""}> flow field overlay</label>` +
        `<div class="row"><button id="dbgStep">step turn (wait)</button><button id="dbgStairs">to stairs</button></div>` +
        `<div class="row"><button id="dbgReport">gen 1000 floors</button></div>` +
        `<pre id="dbgReportOut" style="white-space:pre;font-size:11px;overflow:auto;max-height:220px;margin:6px 0 0"></pre>`;
      const rv = document.getElementById("dbgReveal");
      if (rv) rv.onchange = (e) => { debugState.revealAll = e.target.checked; draw(); };
      const fv = document.getElementById("dbgFlow");
      if (fv) fv.onchange = (e) => { debugState.flow = e.target.checked; RL.updateFlow(game); draw(); };
      document.getElementById("dbgStep").onclick = () => doMove(0, 0);
      document.getElementById("dbgStairs").onclick = () => {
        game.player.x = game.floor.stairs.x; game.player.y = game.floor.stairs.y;
        RL.updateFOV(game); RL.updateFlow(game); resetFx(); render();
      };
      document.getElementById("dbgReport").onclick = () => {
        const out = document.getElementById("dbgReportOut");
        out.textContent = "generating…";
        setTimeout(() => { out.textContent = generateReport(1000, 10).report; }, 10);
      };
    }
  }
  function escapeHtml(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

  // Three visibility states drive the palette: LIT (visible now), DIM
  // (remembered — terrain only, no entities), and unknown (black). Debug
  // reveal-all promotes everything to LIT.
  const PALETTE = {
    lit:  { [TILE.WALL]: "#2a3346", [TILE.FLOOR]: "#0f1420", [TILE.STAIRS]: "#0f1420" },
    dim:  { [TILE.WALL]: "#161b26", [TILE.FLOOR]: "#0a0d13", [TILE.STAIRS]: "#0a0d13" },
  };

  function draw() {
    ctx.fillStyle = "#05060a";
    ctx.fillRect(0, 0, canvas.width, canvas.height); // full clear (unshaken); revealed edges match this
    // Screen shake: translate the whole world by a decaying jitter. Deterministic
    // (time-driven sin/cos) so it needs no RNG and can't touch the sim.
    const s = shakeNow();
    ctx.save();
    if (s > 0.15) ctx.translate(Math.sin(now() * 0.05) * s, Math.cos(now() * 0.043) * s);
    const reveal = debugState.revealAll;
    for (let y = 0; y < game.h; y++) {
      for (let x = 0; x < game.w; x++) {
        const i = idx(x, y);
        const lit = reveal || game.visible[i];
        const known = lit || game.seen[i];
        if (!known) continue; // unknown -> stays black
        const t = game.tiles[i];
        ctx.fillStyle = (lit ? PALETTE.lit : PALETTE.dim)[t];
        ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
        if (t === TILE.STAIRS) {
          ctx.fillStyle = lit ? "#8be9fd" : "#3a5560"; // terrain glyph shows in memory
          ctx.font = "bold 13px ui-monospace, monospace";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(">", x * CELL + CELL / 2, y * CELL + CELL / 2 + 1);
        }
      }
    }
    // Debug flow-field overlay: the numeric distance-to-player on each known
    // tile. Watch the numbers descend toward the player.
    if (DEBUG && debugState.flow && game.flow) {
      ctx.font = "8px monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (let y = 0; y < game.h; y++) {
        for (let x = 0; x < game.w; x++) {
          const i = idx(x, y);
          if (!(reveal || game.visible[i] || game.seen[i])) continue;
          const v = game.flow[i];
          if (v === RL.UNREACHABLE || v < 0) continue;
          ctx.fillStyle = "rgba(120,200,255," + Math.max(0.15, 1 - v / 40) + ")";
          ctx.fillText(v, x * CELL + CELL / 2, y * CELL + CELL / 2);
        }
      }
    }

    // Items — only where currently visible.
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const it of game.items) {
      const i = idx(it.x, it.y);
      if (!(reveal || game.visible[i])) continue;
      const d = RL.ITEM_DEFS[it.defId];
      ctx.fillStyle = d.color;
      ctx.font = "bold 13px ui-monospace, monospace";
      ctx.fillText(d.glyph, it.x * CELL + CELL / 2, it.y * CELL + CELL / 2 + 1);
    }

    // Hit flashes: a brief tint over the cell where damage (or a death) landed.
    fx.flashes = fx.flashes.filter((fl) => now() - fl.at < FLASH_MS);
    for (const fl of fx.flashes) {
      const a = (1 - (now() - fl.at) / FLASH_MS) * 0.55;
      ctx.fillStyle = `rgba(${fl.color},${a.toFixed(3)})`;
      ctx.fillRect(fl.x * CELL, fl.y * CELL, CELL - 1, CELL - 1);
    }

    // Enemies — only where currently visible (never drawn from memory),
    // interpolated from their pre-action cell so movement reads as motion.
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const e of game.enemies) {
      if (!e.alive) continue;
      const i = idx(e.x, e.y);
      if (!(reveal || game.visible[i])) continue;
      const t = RL.ENEMY_TYPES[e.typeId];
      const [px, py] = actorPix(e.id, e.x, e.y);
      ctx.fillStyle = t.color;
      ctx.font = "bold 14px ui-monospace, monospace";
      ctx.fillText(t.glyph, px + CELL / 2, py + CELL / 2 + 1);
      if (DEBUG) {
        ctx.fillStyle = STATE_COLOR[e.state] || "#8899aa";
        ctx.font = "7px monospace";
        ctx.fillText(e.state, px + CELL / 2, py - 2);
      }
    }

    // Player (always drawn; it's the observer and always visible).
    const p = game.player;
    const [ppx, ppy] = actorPix("p", p.x, p.y);
    ctx.fillStyle = "#ffd36b";
    ctx.fillRect(ppx + 2, ppy + 2, CELL - 5, CELL - 5);
    if (DEBUG) {
      ctx.fillStyle = "#4a5568";
      ctx.font = "10px monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      ctx.fillText(`turn ${game.turn}`, 4, 12);
    }
    ctx.restore(); // end shake transform

    // Damage vignette: a red edge-glow that fades after the player is hurt.
    const hk = 1 - (now() - fx.hurtAt) / HURT_MS;
    if (hk > 0) {
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const grd = ctx.createRadialGradient(cx, cy, canvas.width * 0.3, cx, cy, canvas.width * 0.72);
      grd.addColorStop(0, "rgba(180,0,0,0)");
      grd.addColorStop(1, `rgba(180,0,0,${(hk * 0.5).toFixed(3)})`);
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }
  const STATE_COLOR = { idle: "#5a6472", alerted: "#ffd36b", hunting: "#ff6b6b", searching: "#c58bff" };

  function onStairs() { return tileAt(game, game.player.x, game.player.y) === TILE.STAIRS; }
  function render() { draw(); renderSide(); }

  /* --- Player action wrappers (each is one turn) -------------------------- */
  function doMove(dx, dy) {
    if (!game || game.gameOver) return;
    act(() => {
      const acted = playerMove(game, dx, dy); // move / attack / wait; enemies then act
      if (!acted && (dx || dy)) note("Blocked.");
      else if (onStairs() && !game.gameOver) note("Stairs down. Press > to descend.");
    });
  }
  function doUse(slot) {
    if (!game || game.gameOver || !game.inventory[slot]) return;
    act(() => { if (usePlayerItem(game, slot)) blip("use"); });
  }
  function doPickup() { if (game && !game.gameOver) act(() => { playerPickup(game); }); }
  function doDescend() {
    if (!game || game.gameOver || !onStairs()) return;
    game = descend(game);
    RL.advanceGame(game);
    document.getElementById("depthShow").textContent = game.depth;
    note("You descend to depth " + game.depth + ".");
    resetFx(); // fresh floor — snap, don't slide entities across the map
    blip("descend");
    if (game.gameOver) showDeath();
    render();
  }

  /* --- Death screen ------------------------------------------------------- */
  function showDeath() {
    const g = game;
    const row = (k, v) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`;
    document.getElementById("overlayCard").innerHTML =
      `<h2>YOU DIED</h2>` +
      `<div class="sub">seed <code>${escapeHtml(g.seed)}</code></div>` +
      `<table>` +
        row("Depth reached", g.depth) +
        row("Turns taken", g.turn) +
        row("Enemies killed", g.kills) +
        row("Items found", g.itemsFound) +
      `</table>` +
      `<div class="btns">` +
        `<button class="primary" id="retryBtn">Retry this seed</button>` +
        `<button id="newSeedBtn">New seed</button>` +
      `</div>`;
    document.getElementById("overlay").classList.add("show");
    document.getElementById("retryBtn").onclick = () => newRun(g.seed);
    document.getElementById("newSeedBtn").onclick = () => newRun(pickSeed());
  }
  function hideDeath() { document.getElementById("overlay").classList.remove("show"); }

  /* --- Keyboard input ----------------------------------------------------- */
  // One keydown = one turn. Actions resolve synchronously (animation is async and
  // non-blocking), so there is never a sub-turn input queue.
  const KEYMAP = {
    ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
    w: [0,-1], s: [0,1], a: [-1,0], d: [1,0],
    k: [0,-1], j: [0,1], h: [-1,0], l: [1,0],
    y: [-1,-1], u: [1,-1], b: [-1,1], n: [1,1],
    " ": [0,0], ".": [0,0],
  };
  window.addEventListener("keydown", (e) => {
    if (e.target && e.target.tagName === "INPUT") return; // typing a seed, not playing
    if (game.gameOver) return;                            // dead: buttons only, until a new run
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === ">" && onStairs()) { e.preventDefault(); doDescend(); return; }
    if (key >= "1" && key <= "8") { e.preventDefault(); doUse(parseInt(key, 10) - 1); return; }
    if (key === "g") { e.preventDefault(); doPickup(); return; }
    const mv = KEYMAP[key];
    if (!mv) return;
    e.preventDefault();
    doMove(mv[0], mv[1]);
  });

  /* --- Touch controls (shown on coarse pointers / small screens) ---------- */
  document.getElementById("dpad").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    doMove(parseInt(b.dataset.dx, 10), parseInt(b.dataset.dy, 10));
  });
  document.getElementById("acts").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.act === "pickup") doPickup();
    else if (b.dataset.act === "descend") doDescend();
  });
  // Tap an inventory slot to use it (delegated: survives innerHTML rewrites).
  document.getElementById("inv").addEventListener("click", (e) => {
    const s = e.target.closest(".slot"); if (!s || s.dataset.slot == null) return;
    doUse(parseInt(s.dataset.slot, 10));
  });

  /* --- Seed + sound controls --------------------------------------------- */
  document.getElementById("seedGo").onclick = () => {
    const v = document.getElementById("seedInput").value.trim();
    newRun(v || pickSeed());
  };
  document.getElementById("seedInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("seedGo").click();
  });
  const soundBtn = document.getElementById("soundBtn");
  soundBtn.onclick = () => { audioOn = !audioOn; soundBtn.textContent = audioOn ? "🔊" : "🔇"; };

  // Boot.
  if (params.get("test") === "1") {
    const r = runTests();
    document.title = "Roguelike — " + (r.fail === 0 ? "TESTS PASS" : "TESTS FAIL");
  }
  newRun(pickSeed());
  if (DEBUG) document.getElementById("debugPanel").textContent = "enabled";
}

})();
</script>
